<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Search</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
    }
    
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    
    .header h1 {
      font-size: 18px;
      color: #1E88E5;
      margin-bottom: 8px;
    }
    
    .header p {
      font-size: 12px;
      color: #666;
    }
    
    .quick-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .action-btn {
      padding: 10px 16px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      text-align: left;
    }
    
    .action-btn:hover {
      background: #f0f7ff;
      border-color: #1E88E5;
      transform: translateY(-1px);
    }
    
    .action-btn:active {
      transform: translateY(0);
    }
    
    .input-section {
      margin-top: 16px;
    }
    
    .input-section textarea {
      width: 100%;
      min-height: 60px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
    }
    
    .search-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: #1E88E5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .search-btn:hover {
      background: #1565C0;
    }
    
    .shortcut-hint {
      margin-top: 12px;
      padding: 8px;
      background: #fff3cd;
      border-radius: 4px;
      font-size: 11px;
      color: #856404;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 DeepSeek Search</h1>
    <p>快速搜索和AI助手</p>
  </div>
  
  <div class="quick-actions">
    <button class="action-btn" id="searchBtn">🔍 搜索选中文本</button>
    <button class="action-btn" id="translateBtn">🌐 翻译选中文本</button>
    <button class="action-btn" id="explainBtn">💡 解释选中文本</button>
  </div>
  
  <div class="input-section">
    <textarea id="customText" placeholder="或输入自定义文本..."></textarea>
    <button class="search-btn" id="customSearchBtn">搜索</button>
  </div>
  
  <div class="shortcut-hint">
    💡 快捷键: Alt+D (选中文本后按快捷键快速搜索)
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
